<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World!</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
      <header>
          <div id="mimir-logo">
              <img src="../public/mimir-logo.svg" id="mimir-png" />
              <h1>mimir</h1>
          </div>
          <div id="window-menu">
              <button class="menu-button" id="minimize"> </button>
              <button class="menu-button" id="maximize"> </button>
              <button class="menu-button" id="close"> </button>
          </div>
      </header>

      <div id="main-wrapper">
          <aside id="library">
              <div class="section-header" id="library-header">
                  <h2>LIBRARY</h2>
                  <button class="action-button">+</button>
              </div>
          </aside>

          <div class="resize-handle">
          </div>

          <section id="notes">
              <div class="section-header">
                  <h2>NOTES</h2>
                  <button class="action-button">+</button>
              </div>
              <div class="search">
                  <input type="text" id="search-term" placeholder="search">
                  <button class="search-button"></button>
              </div>
          </section>

          <div class="resize-handle">
          </div>

          <section id="wiki">
              <div class="section-header">
                  <h2>WIKI</h2>
                  <button class="action-button">+</button>
              </div>
              <div class="search">
                  <input type="text" id="search-term" placeholder="search">
                  <button class="search-button"></button>
              </div>
          </section>
      </div>

      <script>
          document.getElementById("minimize").onclick = () => { window.windowAPI.minimize(); };
          document.getElementById("maximize").onclick = () => { window.windowAPI.maximize(); };
          document.getElementById("close").onclick = () => { window.windowAPI.close(); };
      </script>

      <script src="main.js"></script>
  </body>
</html>
