<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World!</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>

      <div id="overlay">
          <div>
              <div class="form-elements-wrapper">
                  <input type="text" id="title-input" placeholder="Enter title">
                  <label for="entry-type">Entry type: </label>
                      <select name="type" id="type">
                          <option value="character">Character</option>
                          <option value="place">Place</option>
                          <option value="event">Event</option>
                      </select>
              </div>

              <textarea rows="30" cols="60"></textarea>

              <div class="form-elements-wrapper">
                  <button class="form-button" onclick="switchOverlay();">SUBMIT</button>
                  <button class="form-button" onclick="switchOverlay();">CANCEL</button>
              </div>
          </div>
      </div>

      <header>
          <div id="mimir-logo">
              <img src="../public/mimir-logo.svg" id="mimir-png" />
              <h1>mimir</h1>
          </div>
          <div id="window-menu">
              <button class="menu-button" id="minimize"> </button>
              <button class="menu-button" id="maximize"> </button>
              <button class="menu-button" id="close"> </button>
          </div>
      </header>

      <div id="main-wrapper">
          <aside id="library">
              <div class="sticky-header-wrapper">
                  <div class="section-header">
                      <h2>LIBRARY</h2>
                      <button class="action-button" onclick="switchOverlay();">+</button>
                  </div>
                  <div class="search">
                      <input type="text" id="search-term" placeholder="search">
                      <button class="search-button"></button>
                  </div>
              </div>

              <div class="book-entry">
                  <h4>BOOK TITLE</h4>
                  <button class="action-button" onclick="switchOverlay();"></button>
              </div>
          </aside>

          <div class="resize-handle">
          </div>

          <section id="notes">
              <div class="sticky-header-wrapper">
                  <div class="section-header">
                      <h2>NOTES</h2>
                      <button class="action-button" onclick="switchOverlay();">+</button>
                  </div>
                  <div class="search">
                      <input type="text" id="search-term" placeholder="search">
                      <button class="search-button"></button>
                  </div>
              </div>

              <div class="note-entry">
                  <div class="entry-header">
                      <h4>NOTE TITLE</h4>
                      <p class="page-num">P.NUM</p>
                  </div>
                  <p class="note-content">Note content</p>
                  <div class="note-buttons">
                      <button class="action-button" style="display: inline-block;"></button>
                      <button class="action-button" style="display: inline-block;" onclick="switchOverlay();"></button>
                  </div>
              </div>
          </section>

          <div class="resize-handle">
          </div>

          <section id="wiki">
              <div class="sticky-header-wrapper">
                  <div class="section-header">
                      <h2>WIKI</h2>
                      <button class="action-button" onclick="switchOverlay();">+</button>
                  </div>
                  <div class="search">
                      <input type="text" id="search-term" placeholder="search">
                      <button class="search-button"></button>
                  </div>
              </div>

              <div class="wiki-entry">
                  <div class="entry-header">
                      <h3>ENTRY TITLE</h3>
                      <button class="action-button" onclick="switchOverlay();"></button>
                  </div>
                  <p>Entry text.</p>
              </div>
          </section>
      </div>

      <script>
          document.getElementById("minimize").onclick = () => { window.windowAPI.minimize(); };
          document.getElementById("maximize").onclick = () => { window.windowAPI.maximize(); };
          document.getElementById("close").onclick = () => { window.windowAPI.close(); };
      </script>

      <script src="main.js"></script>
  </body>
</html>
